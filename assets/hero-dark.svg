<text x="38" y="170" font-size="60" font-weight="700" letter-spacing="-1.5" fill="#fff4ec" class="in" style="animation-delay:.3s">Gichogu Macharia<tspan fill="#e85d04">.</tspan></text>
<text class="in" x="40" y="208" font-size="19" fill="#94a3b8" style="animation-delay:.7s">I build AI agents that leave the demo and go to work.</text>
<text class="mono in" x="40" y="254" font-size="14" style="animation-delay:1.00s"><tspan fill="#f48c06">›</tspan> <tspan fill="#94a3b8">role  </tspan><tspan fill="#fff4ec" dx="8">AI Engineer</tspan></text>
<text class="mono in" x="40" y="282" font-size="14" style="animation-delay:1.20s"><tspan fill="#f48c06">›</tspan> <tspan fill="#94a3b8">focus </tspan><tspan fill="#fff4ec" dx="8">multi-agent systems · MLOps · GenAI &amp; RAG</tspan></text>
