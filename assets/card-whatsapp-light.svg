<rect x="32" y="68" width="426" height="150" rx="10" fill="url(#dots)" opacity=".5" mask="url(#cornerfade)"/>
<rect x="216.7" y="90" width="225.3" height="28" rx="9" fill="#e85d04" stroke="#f1dccb"/>
