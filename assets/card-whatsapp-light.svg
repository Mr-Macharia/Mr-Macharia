<svg xmlns="http://www.w3.org/2000/svg" width="490" height="420" viewBox="0 0 490 420" role="img" aria-label="WhatsApp AI Assistant — Multi-agent assistant that lives in WhatsApp: reasons over memory, searches the web, calls third-party APIs and runs scheduled jobs.">
<title>WhatsApp AI Assistant — Multi-agent assistant that lives in WhatsApp: reasons over memory, searches the web, calls third-party APIs and runs scheduled jobs.</title>
<style>
text{font-family:'Host Grotesk','Georama','Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:'Fira Code','JetBrains Mono',SFMono-Regular,Consolas,monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}

.eq{animation:eq 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes eq{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}

</style>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#e85d04" stroke-opacity="0.08" stroke-width="1"/>
  </pattern>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#e85d04" fill-opacity="0.35"/>
  </pattern>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#e85d04" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#e85d04" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#dc2f02"/>
    <stop offset="50%" stop-color="#e85d04"/>
    <stop offset="100%" stop-color="#faa307"/>
  </linearGradient>
  <radialGradient id="fade" cx="100%" cy="0%" r="90%">
    <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="cornerfade"><rect width="490" height="420" fill="url(#fade)"/></mask>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#e85d04" stop-opacity=".9"/>
    <stop offset="28%" stop-color="#f1dccb"/>
    <stop offset="72%" stop-color="#f1dccb"/>
    <stop offset="100%" stop-color="#e85d04" stop-opacity=".55"/>
  </linearGradient>
  <linearGradient id="pfill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#fff4ec"/>
    <stop offset="100%" stop-color="#ffffff"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#dc2f02" stop-opacity="0"/>
    <stop offset="50%" stop-color="#dc2f02" stop-opacity=".8"/>
    <stop offset="100%" stop-color="#dc2f02" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect x="0.5" y="0.5" width="489" height="419" rx="14" fill="url(#pfill)"/>
<rect x="0.5" y="0.5" width="489" height="419" rx="14" fill="url(#grid)"/>
<rect x="0.5" y="0.5" width="489" height="419" rx="14" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
<rect x="73.8" y="0.5" width="342.3" height="1.2" fill="url(#sheen)"/>
<path d="M6.5 20.5V6.5H20.5 M469.5 6.5H483.5V20.5 M483.5 399.5V413.5H469.5 M20.5 413.5H6.5V399.5" fill="none" stroke="#dc2f02" stroke-width="1.5" stroke-linecap="square"/>
<circle cx="490" cy="0" r="260" fill="url(#glow)" opacity=".8"/>
<circle cx="0" cy="420" r="180" fill="url(#glow)" opacity=".35"/>
