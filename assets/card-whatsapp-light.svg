<text x="462" y="346" font-size="120" font-weight="800" letter-spacing="-4" fill="#e85d04" fill-opacity=".07" text-anchor="end">02</text>
<rect x="38" y="76" width="426" height="150" rx="10" fill="#e85d04" fill-opacity=".10"/>
