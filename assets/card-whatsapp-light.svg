<rect x="89.28" y="373" width="71.2" height="24" rx="12.0" fill="#fff1e6" stroke="#f1dccb"/><text class="mono" x="124.9" y="389.3" font-size="12" fill="#0f172a" text-anchor="middle">FastAPI</text>
<rect x="168.52" y="373" width="93.2" height="24" rx="12.0" fill="#fff1e6" stroke="#f1dccb"/><text class="mono" x="215.1" y="389.3" font-size="12" fill="#0f172a" text-anchor="middle">PostgreSQL</text>
<rect x="269.72" y="373" width="115.2" height="24" rx="12.0" fill="#fff1e6" stroke="#f1dccb"/><text class="mono" x="327.3" y="389.3" font-size="12" fill="#0f172a" text-anchor="middle">Evolution API</text>
