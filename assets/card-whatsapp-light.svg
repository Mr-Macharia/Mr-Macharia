<rect x="48.0" y="130" width="232.0" height="28" rx="9" fill="#ffffff" stroke="#f1dccb"/>
<text class="mono" x="60.0" y="148" font-size="11" fill="#0f172a">Done. 16:00 EAT, I&#x27;ll ping you.</text>
<rect x="243.5" y="170" width="198.5" height="28" rx="9" fill="#e85d04" stroke="#f1dccb"/>
<text class="mono" x="255.5" y="188" font-size="11" fill="#fff4ec">and find flights NBO → KGL</text>
<rect x="32" y="68" width="426" height="150" rx="10" fill="none" stroke="url(#edge)"/>
<text x="32" y="268" font-size="28" font-weight="800" letter-spacing="-.8" fill="#0f172a">WhatsApp AI Assistant</text>
<text x="32" y="300" font-size="15" fill="#64748b">Multi-agent assistant that lives in WhatsApp:</text>
<text x="32" y="323" font-size="15" fill="#64748b">reasons over memory, searches the web, calls</text>
<text x="32" y="346" font-size="15" fill="#64748b">third-party APIs and runs scheduled jobs.</text>
