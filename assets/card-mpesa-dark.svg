<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="M-Pesa Daraja Agent Kit — Agent Skills and an MCP server for Safaricom&#x27;s Daraja API. Ask your agent to charge a number; the customer gets a PIN prompt; the agent reports back with the receipt.">
<title>M-Pesa Daraja Agent Kit — Agent Skills and an MCP server for Safaricom&#x27;s Daraja API. Ask your agent to charge a number; the customer gets a PIN prompt; the agent reports back with the receipt.</title>
<style>
text{font-family:'Host Grotesk','Georama','Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:'Fira Code','JetBrains Mono',SFMono-Regular,Consolas,monospace}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}

.pulse{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}

.eq{animation:eq 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes eq{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.35)}}

</style>
<defs>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
    <path d="M24 0H0V24" fill="none" stroke="#e85d04" stroke-opacity="0.07" stroke-width="1"/>
  </pattern>
  <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#e85d04" fill-opacity="0.35"/>
  </pattern>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#e85d04" stop-opacity="0.30"/>
    <stop offset="100%" stop-color="#e85d04" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#dc2f02"/>
    <stop offset="50%" stop-color="#e85d04"/>
    <stop offset="100%" stop-color="#faa307"/>
  </linearGradient>
  <radialGradient id="fade" cx="100%" cy="0%" r="90%">
    <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
    <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="cornerfade"><rect width="1000" height="280" fill="url(#fade)"/></mask>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#e85d04" stop-opacity=".9"/>
    <stop offset="28%" stop-color="#1e293b"/>
    <stop offset="72%" stop-color="#1e293b"/>
    <stop offset="100%" stop-color="#e85d04" stop-opacity=".55"/>
  </linearGradient>
  <linearGradient id="pfill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#131d33"/>
    <stop offset="100%" stop-color="#0f172a"/>
  </linearGradient>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#f48c06" stop-opacity="0"/>
    <stop offset="50%" stop-color="#f48c06" stop-opacity=".8"/>
    <stop offset="100%" stop-color="#f48c06" stop-opacity="0"/>
  </linearGradient>
</defs>
